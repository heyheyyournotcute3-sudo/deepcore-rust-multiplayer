[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client", "crates/lobby", "tools/atlas_gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/heyheyyournotcute3-sudo/deepcore-rust-multiplayer"

[workspace.dependencies]
# --- engine / networking (pinned: verified on crates.io, all target bevy 0.20) ---
bevy = { version = "=0.20.1", default-features = false }
bevy_replicon = "=0.45.5"
bevy_replicon_renet = "=0.21.0"
bevy_egui = "=0.43.1"
egui = "=0.36.0"

# --- serialization / content ---
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
postcard = { version = "1.1.3", features = ["alloc"] }

# --- world / math ---
noise = "0.9"
rand_chacha = "0.10"
rand_core = "0.10"
getrandom = "0.4"

# --- persistence / services ---
zstd = "0.14"
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "signal"] }

# --- observability / misc ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0.18"
clap = { version = "4.5", features = ["derive"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
serde_json = "1.0"
proptest = "1.12"

# Shared crate is used by everything.
deepcore-shared = { path = "crates/shared" }

[profile.dev]
opt-level = 1
debug = 1
incremental = true

# Dependencies are slow-changing and hot in the profile: compile them optimised.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

# Fast local iteration for the binaries only.
[profile.fastdev]
inherits = "dev"
opt-level = 1
